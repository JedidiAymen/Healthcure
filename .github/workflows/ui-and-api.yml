name: UI and API checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medforge-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements-test.txt
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install browser for UI smoke tests
        run: npx playwright install --with-deps chromium
      - name: Install API test dependencies
        run: python -m pip install -r apps/api/requirements-test.txt
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm run test
      - name: Browser shell tests
        run: npm run test:e2e:ci
      - name: API contract tests
        run: python -m pytest -q apps/api/tests
      - name: OpenAPI contract check
        run: npm run contracts:check
      - name: Production build
        run: npm run build
      - name: Offline Academy production-shell browser test
        run: npm run test:e2e:offline -- --workers=1
